[project]
name = "arenahub"
dynamic = ["version"]
description = "Installer and launcher for Quake III Arena, Team Arena and classic mods"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2026.10.19",
    "PySide6>=6.8",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "requests>=2.32,<3",
    "steam-next[client]>=3.0,<4",
]

[project.scripts]
arenahub = "arenahub.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "ruff>=0.7",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the version: bump it there before a release.
path = "src/arenahub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arenahub"]

[tool.uv]
# Always use a uv-managed Python, never the system one
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "PLW"]
