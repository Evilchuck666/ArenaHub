[project]
name = "arenahub"
version = "0.1.0"
description = "ArenaHub - aplicación de escritorio Qt6"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
arenahub = "arenahub.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "ruff>=0.7",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arenahub"]

[tool.uv]
# Usar siempre un Python gestionado por uv (evita problemas con el Python del sistema)
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py313"
