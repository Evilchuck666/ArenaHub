// QUAKE III ARENA CONFIG MADE BY EVILCHUCK
//
// Bindings, HUD, graphics, sound and server settings.
// autoexec.cfg runs this file first, then player.cfg.


//////////////////////
//// KEY BINDINGS ////
//////////////////////

// Start from no bindings at all, so only the keys below do something.

unbindall   // remove every key binding before setting them below


///////////////////////
//// LOOK BINDINGS ////
///////////////////////

// How you aim. The mouse aims on its own; this adds the zoom.

bind    MOUSE2  "+zoom"    // zoom in while held


///////////////////////
//// MOVE BINDINGS ////
///////////////////////

// How you move. WASD layout, always running, SHIFT to walk.

seta    cl_run  "1"             // always run
bind    SHIFT   "+speed"        // walk while held (you run by default)
bind    w       "+forward"      // move forward
bind    a       "+moveleft"     // strafe left
bind    s       "+back"         // move back
bind    d       "+moveright"    // strafe right
bind    SPACE   "+moveup"       // jump
bind    CTRL    "+movedown"     // crouch


////////////////////////
//// SHOOT BINDINGS ////
////////////////////////

// Firing and choosing weapons, each one on its own key.

seta    cg_autoswitch   "0"           // keep your weapon when you pick up a new one
bind    MOUSE1          "+attack"     // fire
bind    MWHEELUP        "weapnext"    // next weapon
bind    MWHEELDOWN      "weapprev"    // previous weapon
bind    e               "weapon 1"    // gauntlet
bind    c               "weapon 2"    // machine gun
bind    z               "weapon 3"    // shotgun
bind    v               "weapon 4"    // grenade launcher
bind    q               "weapon 5"    // rocket launcher
bind    x               "weapon 6"    // lightning gun
bind    r               "weapon 7"    // railgun
bind    f               "weapon 8"    // plasma gun


////////////////////////
//// MISC. BINDINGS ////
////////////////////////

// Console, scores, holdable items and chat.

bind    ~       "toggleconsole"    // open and close the console
bind    TAB     "+scores"          // show the scoreboard while held
bind    ENTER   "+button2"         // use your holdable item (medkit, teleporter...)
bind    MOUSE3  "+button2"         // use your holdable item (medkit, teleporter...)
bind    t       "messagemode"      // chat to everyone
bind    y       "messagemode2"     // chat to your team
bind    u       "messagemode3"     // message the player under your crosshair
bind    i       "messagemode4"     // message the last player who hit you


////////////////////////
//// OTHER BINDINGS ////
////////////////////////

// Match helpers: votes, ready status and screenshots.

bind    F1  "vote yes"      // vote yes
bind    F2  "vote no"       // vote no
bind    F3  "ready"         // tell the server you are ready (mod warmups)
bind    F11 "screenshot"    // save a screenshot


//////////////////////////////////////
//// CLIENT GAME VM CONFIGURATION ////
//////////////////////////////////////

// What you see in game (cg_*): HUD, crosshair, effects and view movement.

seta    cg_animspeed            "1"       // animate player models
seta    cg_bobpitch             "0"       // no view bobbing while moving (pitch)
seta    cg_bobroll              "0"       // no view bobbing while moving (roll)
seta    cg_bobup                "0"       // no view bobbing while moving (up and down)
seta    cg_brassTime            "1000"    // ejected shells stay this long (ms)
seta    cg_centertime           "1"       // center-screen messages stay this long (s)
seta    cg_crosshairHealth      "0"       // crosshair color does not follow your health
seta    cg_draw2D               "1"       // draw the HUD
seta    cg_draw3dIcons          "0"       // flat HUD icons instead of 3D models
seta    cg_drawAmmoWarning      "0"       // no low ammo warning
seta    cg_drawAttacker         "1"       // show who last hit you
seta    cg_drawCrosshair        "1"       // crosshair style
seta    cg_drawCrosshairNames   "1"       // show the name of the player you aim at
seta    cg_drawFPS              "1"       // show frames per second
seta    cg_drawFriend           "1"       // mark teammates with an icon
seta    cg_drawGun              "1"       // show your weapon
seta    cg_drawIcons            "1"       // show HUD icons
seta    cg_drawRewards          "1"       // show medals (Excellent, Impressive...)
seta    cg_drawStatus           "1"       // show health, armor and ammo
seta    cg_drawTeamOverlay      "1"       // show your teammates status in team games
seta    cg_drawTimer            "1"       // show the match clock
seta    cg_forceModel           "1"       // force the team and enemy models set below (1 = yes)
seta    cg_footsteps            "1"       // footstep sounds
seta    cg_fov                  "110"     // field of view (degrees)
seta    cg_gibs                 "1"       // gibs on deaths
seta    cg_lagometer            "1"       // show the network lagometer
seta    cg_marks                "1"       // bullet and explosion marks on walls
seta    cg_noProjectileTrail    "1"       // no smoke trails behind rockets and grenades
seta    cg_noTaunt              "1"       // mute player taunts
seta    cg_noVoiceChats         "1"       // mute voice chats
seta    cg_noVoiceText          "1"       // hide voice chat text
seta    cg_oldPlasma            "1"       // classic plasma look
seta    cg_oldRail              "1"       // classic railgun trail
seta    cg_oldRocket            "0"       // rocket smoke: 0 = Team Arena style, 1 = classic
seta    cg_predictItems         "0"       // wait for the server to confirm item pickups
seta    cg_railTrailTime        "1499"    // railgun trail stays this long (ms)
seta    cg_runpitch             "0"       // no view tilt while running (pitch)
seta    cg_runroll              "0"       // no view tilt while running (roll)
seta    cg_scorePlums           "1"       // show points over the players you frag
seta    cg_shadows              "1"       // simple shadows under players
seta    cg_simpleItems          "1"       // draw items as flat icons
seta    cg_swingSpeed           "1"       // player models turn at once to where they aim
seta    cg_trueLightning        "1"       // the lightning beam follows your aim exactly
seta    cg_zoomfov              "60"      // field of view while zooming (degrees)


//////////////////////////////
//// CLIENT CONFIGURATION ////
//////////////////////////////

// Your connection to servers and the mouse (cl_*).

seta    cl_allowDownload    "1"      // download missing maps and mods from servers
seta    cl_anonymous        "0"      // do not hide your identity from the server
seta    cl_maxpackets       "125"    // packets sent to the server per second
seta    cl_mouseAccel       "0"      // no mouse acceleration


////////////////////////////////////
//// WEAPON COLOR CONFIGURATION ////
////////////////////////////////////

// Railgun trail colors.

seta    color   "7"    // railgun trail color (mods use it for player colors too)
seta    color1  "7"    // railgun core color
seta    color2  "7"    // railgun spiral color


////////////////////////////////////////////
//// COMMON CLIENT/SERVER CONFIGURATION ////
////////////////////////////////////////////

// Settings shared by the game and the server (com_*).

seta    com_blood       "1"      // show blood
seta    com_introplayed "1"      // skip the intro video
seta    com_maxfps      "125"    // frame rate limit (125 = classic Quake III movement)


//////////////////////////////////////
//// SERVER GAME VM CONFIGURATION ////
//////////////////////////////////////

// Rules for matches you host yourself (g_*), including games against bots.

seta    g_allowVote     "1"     // players can call votes
seta    g_doWarmup      "1"     // warmup before the match starts
seta    g_enableBreath  "1"     // breath puffs on cold maps
seta    g_enableDust    "1"     // dust on some maps
seta    g_forcerespawn  "5"     // respawn automatically after this many seconds
seta    g_warmup        "60"    // warmup length (s)


//////////////////////////////
//// RENDER CONFIGURATION ////
//////////////////////////////

// Graphics (r_*): video mode, textures, lighting and detail.

seta    r_colorbits                 "32"                         // color depth (bits)
seta    r_depthbits                 "24"                         // depth buffer precision (bits)
seta    r_detailtextures            "1"                          // extra detail textures
seta    r_dlightBacks               "1"                          // dynamic lights also on back faces
seta    r_drawSun                   "1"                          // draw the sun
seta    r_dynamiclight              "1"                          // dynamic lights from rockets, plasma...
seta    r_facePlaneCull             "1"                          // skip surfaces facing away (faster)
seta    r_fastsky                   "0"                          // draw the real sky
seta    r_flares                    "1"                          // light flares
seta    r_fullbright                "0"                          // normal lighting
seta    r_fullscreen                "1"                          // fullscreen
seta    r_lodbias                   "0"                          // highest model detail
seta    r_mode                      "6"                          // resolution: 6 = 1024x768, -2 = desktop resolution
seta    r_overBrightBits            "1"                          // brighter lighting
seta    r_picmip                    "0"                          // full texture detail (higher = blurrier)
seta    r_roundImagesDown           "0"                          // do not shrink textures
seta    r_subdivisions              "1"                          // detail of curved surfaces (lower = smoother)
seta    r_texturebits               "32"                         // texture color depth (bits)
seta    r_textureMode               "GL_LINEAR_MIPMAP_LINEAR"    // texture filtering (trilinear)


/////////////////////////////
//// SOUND CONFIGURATION ////
/////////////////////////////

// Sound (s_*).

seta    s_doppler       "1"       // doppler effect on passing projectiles
seta    s_musicvolume   "0"       // music volume
seta    s_volume        "0.75"    // sound effects volume


//////////////////////////////
//// SERVER CONFIGURATION ////
//////////////////////////////

// Network and physics for the matches you host.

seta    pmove_fixed         "0"      // movement physics independent of frame rate
seta    snaps               "40"     // updates per second you ask from the server
seta    sv_allowDownload    "1"      // players can download missing files from your server
seta    sv_floodProtect     "1"      // limit chat spam on your server
seta    sv_fps              "125"    // server frames per second


////////////////////////////////////////////
//// THREEWAVE TEAM BASED CONFIGURATION ////
////////////////////////////////////////////

// Threewave options to tell enemies and teammates apart. Teammates use your own
// model (player.cfg); enemies use the one below, with CPMA's bright "pm" skins.

seta    cg_usepromodeskins  "1"            // bright CPMA skins, needed by the "pm" models
seta    cg_enemymodel       "tankjr/pm"    // draw every enemy with this model
seta    cg_enemyheadmodel   "tankjr/pm"    // and with this head
