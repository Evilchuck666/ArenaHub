// QUAKE III ARENA CONFIG MADE BY EVILCHUCK
//
// Your player settings. autoexec.cfg runs this file after game.cfg, so
// anything here wins. ArenaHub rewrites name and sensitivity when you
// change them in its Play tab and leaves the rest of the file alone.


/////////////////////////////////////
//// PLAYER CUSTOM CONFIGURATION ////
/////////////////////////////////////

// Who you are in game. ArenaHub updates name and sensitivity from its Play tab.

seta    name            "Player"       // your player name
seta    sensitivity     "3"            // mouse sensitivity
seta    model           "ranger/pm"    // your player model
seta    headmodel       "ranger/pm"    // your player head
seta    team_model      "ranger/pm"    // your model in team games
seta    team_headmodel  "ranger/pm"    // your head in team games
