// QUAKE III ARENA CONFIG MADE BY EVILCHUCK


unbindall


///////////////////////
//// LOOK BINDINGS ////
///////////////////////

bind    MOUSE2  "+zoom"


///////////////////////
//// MOVE BINDINGS ////
///////////////////////

seta    cl_run  "1"
bind    SHIFT   "+speed"
bind    w       "+forward"
bind    a       "+moveleft"
bind    s       "+back"
bind    d       "+moveright"
bind    SPACE   "+moveup"
bind    CTRL    "+movedown"


////////////////////////
//// SHOOT BINDINGS ////
////////////////////////

seta    cg_autoswitch   "0"
bind    MOUSE1          "+attack"
bind    MWHEELUP        "weapnext"
bind    MWHEELDOWN      "weapprev"
bind    e               "weapon 1"
bind    c               "weapon 2"
bind    z               "weapon 3"
bind    v               "weapon 4"
bind    q               "weapon 5"
bind    x               "weapon 6"
bind    r               "weapon 7"
bind    f               "weapon 8"


////////////////////////
//// MISC. BINDINGS ////
////////////////////////

bind    ~       "toggleconsole"
bind    TAB     "+scores"
bind    ENTER   "+button2"
bind    MOUSE3  "+button2"
bind    t       "messagemode"
bind    y       "messagemode2"
bind    u       "messagemode3"
bind    i       "messagemode4"


////////////////////////
//// OTHER BINGINGS ////
////////////////////////

bind    F1  "vote yes"
bind    F2  "vote no"
bind    F3  "ready"
bind    F11 "screenshot"


