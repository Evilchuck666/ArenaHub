name: Build desktop app

# Disabled by default. Pushes and pull requests only build when the repository
# variable ARENAHUB_CI is set to "true" (Settings → Secrets and variables →
# Actions → Variables); otherwise the run shows up as skipped and uses no
# minutes. "Run workflow" always works: leave the version empty to just build,
# or give one (e.g. 1.0.0, matching src/arenahub/__init__.py) to also publish
# a GitHub release with the four packages.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'scripts/**'
      - 'run.py'
      - 'ArenaHub.spec'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  desktop:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || vars.ARENAHUB_CI == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 \
            xvfb xauth

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run pytest -v

      - name: Smoke test from source
        run: uv run arenahub --smoke-test

      - name: Build single-file executable
        run: uv run pyinstaller ArenaHub.spec --clean --noconfirm

      - name: Verify and package
        run: uv run python scripts/package.py

      - name: Verify startup on X11 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run python scripts/package.py --verify-only --qt-platform xcb

      - uses: actions/upload-artifact@v7
        with:
          name: ArenaHub-${{ matrix.os }}
          path: |
            dist/ArenaHub-*.tar.gz
            dist/ArenaHub-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: desktop
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: arenahub-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      PACKAGES: >-
        ArenaHub-linux-x64.tar.gz
        ArenaHub-windows-x64.zip
        ArenaHub-macos-x64.zip
        ArenaHub-macos-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 1.0.0, without the v."
            exit 1
          fi

          code_version=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/arenahub/__init__.py)
          if [[ "$code_version" != "$VERSION" ]]; then
            echo "::error::src/arenahub/__init__.py says $code_version. Bump it to $VERSION first."
            exit 1
          fi

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: ArenaHub-*
          path: release-assets
          merge-multiple: true

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for file in $PACKAGES; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum $PACKAGES > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" $PACKAGES SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "ArenaHub v$VERSION" \
            --generate-notes \
            --latest
