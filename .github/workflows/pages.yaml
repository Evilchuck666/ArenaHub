name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: project-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate project page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only the list of public files: installers.yaml checks and runs the install scripts.
      - name: Check public files
        shell: bash
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -f site/.nojekyll
          test -s site/favicon.svg
          test -s site/install.sh
          test -s site/install.ps1
          test "$(find site -type f | wc -l)" -eq 8
          test -s site/assets/screenshots/installation.png
          test -s site/assets/screenshots/server.png

  # Upload and deploy in separate jobs, as in GitHub's own Pages workflow. In one job,
  # deploy-pages can look for the artifact before the artifact list shows it ("No
  # artifacts named github-pages"), and re-running that job then finds two. Re-running
  # only the deploy job reuses this upload.
  build:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
