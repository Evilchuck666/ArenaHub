name: Build desktop app

# Disabled by default. Pushes and pull requests only build when the repository
# variable ARENAHUB_CI is set to "true" (Settings → Secrets and variables →
# Actions → Variables). Only change detection and the final status run
# when no application work is needed. "Run workflow" always works: leave the version empty to just build,
# or give one (e.g. 1.0.0, matching src/arenahub/__init__.py and arch/PKGBUILD) to
# also publish a GitHub release with the four packages, upload the wheel and the
# source distribution to PyPI (Trusted Publishing, environment "pypi") and push
# arch/PKGBUILD to the arenahub-bin AUR package (needs the AUR_SSH_PRIVATE_KEY secret).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      build: ${{ steps.filter.outputs.build }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "src/**",
                  "assets/**",
                  "run.py",
                  "pyproject.toml",
                  "uv.lock",
                  ".python-version",
                  "scripts/ArenaHub.spec",
                  "scripts/package.py",
                  "tests/**",
                  ".github/workflows/release.yaml",
                  "scripts/**"
                ],
                "exclude": [
                  "tests/**.md"
                ]
              },
              "build": {
                "include": [
                  "src/**",
                  "assets/**",
                  "run.py",
                  "pyproject.toml",
                  "uv.lock",
                  ".python-version",
                  "scripts/ArenaHub.spec",
                  "scripts/package.py",
                  ".github/workflows/release.yaml"
                ],
                "exclude": []
              },
              "metadata": {
                "include": [
                  "README.md",
                  "TECHNICAL_GUIDE.md",
                  "LICENSE",
                  "pyproject.toml",
                  "arch/**"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  desktop:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.build == 'true') && (github.event_name == 'workflow_dispatch' || vars.ARENAHUB_CI == 'true')
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 \
            xvfb xauth

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run pytest -v

      - name: Smoke test from source
        run: uv run arenahub --smoke-test

      - name: Build single-file executable
        if: needs.changes.outputs.build == 'true'
        run: uv run pyinstaller scripts/ArenaHub.spec --clean --noconfirm

      - name: Verify and package
        if: needs.changes.outputs.build == 'true'
        run: uv run python scripts/package.py

      - name: Verify startup on X11 (Linux)
        if: (needs.changes.outputs.build == 'true') && (runner.os == 'Linux')
        run: xvfb-run -a uv run python scripts/package.py --verify-only --qt-platform xcb

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.build == 'true'
        with:
          name: ArenaHub-${{ matrix.os }}
          path: |
            dist/ArenaHub-*.tar.gz
            dist/ArenaHub-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [desktop, python]
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: arenahub-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      PACKAGES: >-
        ArenaHub-linux-x64.tar.gz
        ArenaHub-windows-x64.zip
        ArenaHub-macos-x64.zip
        ArenaHub-macos-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 1.0.0, without the v."
            exit 1
          fi

          code_version=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/arenahub/__init__.py)
          if [[ "$code_version" != "$VERSION" ]]; then
            echo "::error::src/arenahub/__init__.py says $code_version. Bump it to $VERSION first."
            exit 1
          fi

          pkgbuild_version=$(sed -nE 's/^pkgver=(.*)/\1/p' arch/PKGBUILD)
          if [[ "$pkgbuild_version" != "$VERSION" ]]; then
            echo "::error::arch/PKGBUILD says $pkgbuild_version. Bump it to $VERSION first."
            exit 1
          fi

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: ArenaHub-*
          path: release-assets
          merge-multiple: true

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for file in $PACKAGES; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum $PACKAGES > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" $PACKAGES SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "ArenaHub v$VERSION" \
            --generate-notes \
            --latest

  python:
    name: Python package
    needs: [changes]
    if: (needs.changes.outputs.build == 'true' || needs.changes.outputs.metadata == 'true') && (github.event_name == 'workflow_dispatch' || vars.ARENAHUB_CI == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-shape0 libxcb-keysyms1

      - name: Build wheel and source distribution
        run: |
          uv build --clear
          uvx twine check --strict dist/*

      # The wheel must carry the files the app reads at run time, but not the map packs.
      - name: Check the wheel contents
        shell: python
        run: |
          import glob
          import zipfile

          (wheel,) = glob.glob('dist/*.whl')
          names = zipfile.ZipFile(wheel).namelist()
          for folder in ('cfg', 'icons', 'levelshots', 'links'):
              if not any(name.startswith(f'arenahub/assets/{folder}/') for name in names):
                  raise SystemExit(f'{wheel} has no arenahub/assets/{folder}')
          if any('/maps/' in name for name in names):
              raise SystemExit(f'{wheel} contains map packs')
          print(f'{wheel}: {len(names)} files')

      - name: Smoke test the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/arenahub --smoke-test
          wheel/bin/python -I -c "
          from arenahub.core import configs, maps, paths
          assert configs.bundled_game_dirs(), 'no game configs in ' + str(paths.resource('cfg'))
          assert all(maps.thumbnail(pack).is_file() for pack in maps.MAPS), 'missing levelshots'
          print('Installed wheel reads its files from', paths.resource())
          "

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ArenaHub/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      # No API token: PyPI trusts this workflow file and environment directly.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the AUR_SSH_PRIVATE_KEY secret to update the AUR package."
            exit 1
          fi

      - name: Set up SSH and git
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh pacman-contrib
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Pinned AUR host keys, see https://aur.archlinux.org
          cat > "$ssh_dir/known_hosts" << 'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          # Inside a container HOME is /github/home but ssh reads ~/.ssh from
          # /etc/passwd (/root), so pass the key and host keys explicitly.
          echo "GIT_SSH_COMMAND=ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config --global user.name "Evilchuck666"
          git config --global user.email "carlos.martinez.medina1992@gmail.com"
          # The first clone of a new AUR package is empty; the AUR only accepts master.
          git config --global init.defaultBranch master

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: repo

      # arch/PKGBUILD is the source of truth: copy it over the AUR one with pkgrel
      # reset to 1, fill in the checksums of the release just published, check that
      # it builds and regenerate .SRCINFO. makepkg refuses root.
      - name: Push PKGBUILD to the AUR
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/arenahub-bin.git aur
          useradd -m builder
          cp repo/arch/PKGBUILD repo/arch/arenahub.desktop aur/
          cd aur
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          su builder -c 'updpkgsums'
          su builder -c 'makepkg --nodeps --force --noconfirm'
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO arenahub.desktop
          if git diff --cached --quiet; then
            echo "AUR package is already at $VERSION."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master

  result:
    name: CI result
    if: always()
    needs: [changes, desktop, python, release, pypi, aur]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
